# Spring Application
spring.application.name=ClinicalManagementSystem
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:clinicaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Configuration (pointing directly to the separated frontend folder)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:../frontend/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Static Resources (pointing directly to the separated frontend folder)
spring.web.resources.static-locations=file:../frontend/
